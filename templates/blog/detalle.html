{% extends "layout/base.html" %}
{% block title %}{{ post.titulo }} — Blog{% endblock %}
{% block content %}
<article class="prose">
  <h1>{{ post.titulo }}</h1>
  <p class="text-muted">{{ post.creado_en|date:"d/m/Y H:i" }}</p>
  <div>{{ post.contenido|linebreaks }}</div>
</article>
<a class="btn btn-link mt-3" href="{% url 'blog:list' %}">← Volver al blog</a>
{% endblock %}
