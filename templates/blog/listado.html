{% extends "layout/base.html" %}
{% block title %}Blog — HuellaSolidaria{% endblock %}
{% block content %}
<h1 class="mb-3">Blog</h1>
{% if posts %}
  <ul class="list-group">
    {% for p in posts %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'blog:detail' p.slug %}">{{ p.titulo }}</a>
        <small class="text-muted">{{ p.creado_en|date:"d/m/Y H:i" }}</small>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <div class="alert alert-info mt-3">Aún no hay publicaciones.</div>
{% endif %}
{% endblock %}
