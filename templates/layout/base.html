{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Huella Solidaria{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome (iconos hueso/pez, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-3hH8oA..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tu CSS -->
  <link href="{% static 'css/site.css' %}" rel="stylesheet">

  <style>
    html, body { height: 100%; }

    /* Botoncito flotante en cada tarjeta para donar */
    .donate-fab{
      position:absolute; bottom:.5rem; right:.5rem;
      width:42px; height:42px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:#ffc107; color:#0b2e5a; box-shadow:0 4px 10px rgba(0,0,0,.15);
      transition:transform .15s ease, background-color .15s ease, color .15s ease;
      text-decoration:none;
    }
    .donate-fab:hover{ transform:scale(1.06); background:#ffcd39; color:#0b2e5a; }

    /* Colores opcionales por tipo (si quieres distinguirlos visualmente) */
    .donate-fab.dog { background:#ffd24d; }
    .donate-fab.cat { background:#b9e3ff; color:#0b2e5a; }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  {% include "partials/_navbar.html" %}

  {% if messages %}
    <div class="container mt-3">
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }}">{{ m }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("current-year").textContent = new Date().getFullYear();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
