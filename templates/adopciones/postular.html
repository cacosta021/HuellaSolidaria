{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container py-4">
  <a href="{% url 'adopta_detalle' mascota.pk %}" class="btn btn-outline-secondary btn-sm mb-3">← Volver</a>
  <h3 class="mb-3">Postular por {{ mascota.nombre }}</h3>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6">
      <label class="form-label">Nombres *</label>
      <input name="nombres" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Apellidos *</label>
      <input name="apellidos" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Email *</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Teléfono</label>
      <input name="telefono" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Ciudad</label>
      <input name="ciudad" class="form-control">
    </div>
    <div class="col-12">
      <label class="form-label">Mensaje</label>
      <textarea name="mensaje" rows="3" class="form-control"></textarea>
    </div>
    <div class="col-12">
      <button class="btn btn-primary">Enviar Postulaci&oacute;n</button>
    </div>
  </form>
</div>
